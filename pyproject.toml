[project]
name = "travel-kb"
version = "0.1.0"
description = "个人旅行规划用的 MCP Server：代码核验景点开放时间、同名消歧等硬事实"
requires-python = ">=3.12"
dependencies = [
    "mcp[cli]>=2.2,<3",
    "pydantic>=2",
    "pyyaml",
    "python-dateutil",
]

[project.scripts]
travelkb-server = "travelkb.server:main"

[dependency-groups]
dev = [
    "pytest",
    "anyio",
    "ruff",
]

[build-system]
requires = ["uv_build>=0.8.17,<0.9.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
# 发行名是 travel-kb，但 import 名是 travelkb（默认会推成 travel_kb）
module-name = "travelkb"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
# T20 = flake8-print：把「禁止 print」变成 lint 错误，而不是靠自觉
select = ["E", "F", "I", "UP", "B", "T20"]

[tool.ruff.lint.per-file-ignores]
# scripts/ 是命令行工具，往终端打印是它的本职；禁 print 只针对 server 代码（stdout 是协议通道）
"scripts/*" = ["T201"]

[tool.ruff.lint.isort]
# 显式声明本项目的包，不让 ruff 按目录猜（tests/unit 下会猜错）
known-first-party = ["travelkb"]
