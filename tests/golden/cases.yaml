# 金标准：用真实数据跑真实问题，答案由 Aaron 回官网独立核对后填写。
#
# 为什么要独立：data/pois/*.yaml 是 CC 起草的。如果 expect 也照 YAML 抄，
# YAML 抄错一个时间，测试照样全绿。只有回官网看原文再填，才能抓住 YAML 和引擎的错。
#
# 怎么填（每条）：
#   1. 打开 check 指的官网页面（data/sources/ 里有当时的原文摘录，可以对照）
#   2. 自己判断这个问题的正确答案，填 expect（只写你确定的字段，没写的字段不比较）：
#        is_open：status（OPEN / CLOSED / UNKNOWN）、weekday（MON…SUN）、reason_code，
#                 可选 open / close / last_entry（"HH:MM"）、rule_ids
#        resolve_poi：status（MATCH / AMBIGUOUS / NOT_FOUND）、candidates（poi_id 列表，按字母序）
#      UNKNOWN 的题，答案来自规则语义（有效期、没写的时段），不来自官网，check 里写了依据
#   3. 填 source_url（官网页面）和 checked_at（你核对的日期）
#   expect 为 null 的题会被跳过，并提示「待 Aaron 填写」
#   note 写你的判断理由（自由文字，测试不读它）
#
# 例：expect: {status: CLOSED, weekday: MON, reason_code: WEEKLY_RULE}
#     note: 周一固定闭馆，官网原文 Monday: CLOSED
#
# 日期速查（2026）：10-12 周一，10-13 周二，10-14 周三，10-15 周四，11-01 周日，11-02 周一

- id: g01
  type: open_day
  question: 2026-10-13（周二）去布达佩斯美术馆，开门吗？几点到几点？
  call: {tool: is_open, args: {poi_id: museum-of-fine-arts-budapest, date: 2026-10-13}}
  check: https://www.mfab.hu 的开放时间弹窗
  expect: {status: OPEN, weekday: TUE, open: "10:00", close: "18:00"}
  note: 开门，10-13是周二，没有别的活动冲突，正常开门10:00-18:00
  source_url: https://www.mfab.hu
  checked_at: 2026-10-10

- id: g02
  type: weekly_closed
  question: 2026-10-12（周一）去布达佩斯美术馆，开门吗？
  call: {tool: is_open, args: {poi_id: museum-of-fine-arts-budapest, date: 2026-10-12}}
  check: https://www.mfab.hu 的开放时间弹窗
  expect: {status: CLOSED, weekday: MON, reason_code: WEEKLY_RULE}
  note: 不开门，10-12是周一，每周一固定休假
  source_url: https://www.mfab.hu
  checked_at: 2026-10-10

- id: g03
  type: out_of_window
  question: 2027-01-12 去圣史蒂芬大教堂，开门吗？
  call: {tool: is_open, args: {poi_id: st-stephens-basilica-church, date: 2027-01-12}}
  check: 规则语义——有效期 = 核验日 2026-10-08 起 90 天；对照 ROADMAP 第 7 节第 1 步
  expect: {status: UNKNOWN, reason_code: NOT_COVERED}
  note: 找不到，出行日期距今超过未来90天，须核验
  source_url: https://bazilikabudapest.hu/nyitvatartas/
  checked_at: 2026-10-10

- id: g04
  type: same_name_in_city
  question: 下周去布达佩斯的「美术馆」，是哪一家？
  call: {tool: resolve_poi, args: {query: 美术馆, city: Budapest}}
  check: 两家官网各自的名称：https://en.mng.hu 、https://www.mfab.hu
  expect: {status: AMBIGUOUS, candidates: [hungarian-national-gallery, museum-of-fine-arts-budapest]}
  note: 询问用户具体是哪个美术馆（可以摆出两个标志性作品以帮助区分）
  source_url: https://en.mng.hu 、https://www.mfab.hu
  checked_at: 2026-10-10

- id: g05
  type: not_in_kb
  question: 盖勒特温泉几点开门？（库里没有这个景点）
  call: {tool: resolve_poi, args: {query: 盖勒特温泉, city: Budapest}}
  check: 规则语义——库里没有的景点不能猜
  expect: {status: NOT_FOUND, candidates: []}
  note: 告知用户暂未收录
  source_url: https://www.gellertbath.hu/
  checked_at: 2026-10-10

- id: g06
  type: after_last_entry
  question: 2026-10-14（周三）17:30 到匈牙利国家美术馆，还能进吗？
  call: {tool: is_open, args: {poi_id: hungarian-national-gallery, date: 2026-10-14, time: "17:30"}}
  check: https://en.mng.hu 的开放时间弹窗
  expect: {status: CLOSED, weekday: WED, reason_code: AFTER_LAST_ENTRY, last_entry: "17:00"}
  note: 虽然官网写entry from 10am to 6pm，但是5pm从顶楼开始清人，原文：“Entry is allowed until 5.00 pm – also with pre-purchased or free tickets.”，故不能进
  source_url: https://en.mng.hu
  checked_at: 2026-10-10

- id: g07
  type: exception_closed
  question: 2026-11-01（周日）去沃伊达奇城堡里的农业博物馆，开门吗？
  call: {tool: is_open, args: {poi_id: hungarian-museum-of-agriculture, date: 2026-11-01}}
  check: https://www.mezogazdasagimuzeum.hu/information/opening-hours 的 Public Holidays 一节
  expect: {status: CLOSED, weekday: SUN, reason_code: EXCEPTION}
  note: 虽然不是周一日常闭馆，但是11-01是public holiday往下拉有写，故不开门
  source_url: https://www.mezogazdasagimuzeum.hu/information/opening-hours
  checked_at: 2026-10-10

- id: g08
  type: exception_changed_hours
  question: 2026-11-13（周五）11:00 到布达佩斯美术馆，能进吗？
  call: {tool: is_open, args: {poi_id: museum-of-fine-arts-budapest, date: 2026-11-13, time: "11:00"}}
  check: https://www.mfab.hu 弹窗里的 Changed opening hours
  expect: {status: CLOSED, weekday: FRI, reason_code: BEFORE_OPENING, open: "12:00"}
  note: >-
    Aaron 2026-10-10 定：原题 10-09 已过、官网删了那条没法复核，改成 11-13。
    官网原文 FRIDAY, 13 NOVEMBER: 12.00 to 20.00 → 12 点才开门，11:00 进不去。
    （expect 由 CC 按 Aaron 复制的原文填写，Aaron 2026-10-10 确认）
  source_url: https://www.mfab.hu
  checked_at: 2026-10-10

- id: g09
  type: outside_known_hours
  question: 2026-10-15（周四）20:30 去渔人堡收费观景台，能进吗？
  call: {tool: is_open, args: {poi_id: fishermans-bastion-terrace, date: 2026-10-15, time: "20:30"}}
  check: https://ticket.budavar.hu/en 的弹窗——注意它写的是 Payment periods，不是开放时段
  expect: {status: UNKNOWN}
  note: 能进，payment period只是代表这段时间段是需要付费的，outside这些时间段则免费，理论上是24/7开放的。但找不到确切信息，须如实告知用户
  source_url: https://ticket.budavar.hu/en
  checked_at: 2026-10-10

- id: g10
  type: season_boundary
  question: 2026-11-02（周一）17:00 到国会大厦，还开着吗？
  call: {tool: is_open, args: {poi_id: hungarian-parliament, date: 2026-11-02, time: "17:00"}}
