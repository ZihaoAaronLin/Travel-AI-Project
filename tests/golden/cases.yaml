# 金标准：用真实数据跑真实问题，答案由 Aaron 回官网独立核对后填写。
#
# 为什么要独立：data/pois/*.yaml 是 CC 起草的。如果 expect 也照 YAML 抄，
# YAML 抄错一个时间，测试照样全绿。只有回官网看原文再填，才能抓住 YAML 和引擎的错。
#
# 怎么填（每条）：
#   1. 打开 check 指的官网页面（data/sources/ 里有当时的原文摘录，可以对照）
#   2. 自己判断这个问题的正确答案，填 expect（只写你确定的字段，没写的字段不比较）：
#        is_open：status（OPEN / CLOSED / UNKNOWN）、weekday（MON…SUN）、reason_code，
#                 可选 open / close / last_entry（"HH:MM"）、rule_ids
#        resolve_poi：status（MATCH / AMBIGUOUS / NOT_FOUND）、candidates（poi_id 列表，按字母序）
#      UNKNOWN 的题，答案来自规则语义（有效期、没写的时段），不来自官网，check 里写了依据
#   3. 填 source_url（官网页面）和 checked_at（你核对的日期）
#   expect 为 null 的题会被跳过，并提示「待 Aaron 填写」
#
# 日期速查（2026）：10-12 周一，10-13 周二，10-14 周三，10-15 周四，11-01 周日，11-02 周一

- id: g01
  type: open_day
  question: 2026-10-13（周二）去布达佩斯美术馆，开门吗？几点到几点？
  call: {tool: is_open, args: {poi_id: museum-of-fine-arts-budapest, date: 2026-10-13}}
  check: https://www.mfab.hu 的开放时间弹窗
  expect: null
  source_url: null
  checked_at: null

