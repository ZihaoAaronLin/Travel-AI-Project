# 评测题库。格式和填法见 eval/DESIGN.md 第 2 节。
#
# gold.verdict 四选一：OPEN / CLOSED / UNKNOWN / AMBIGUOUS
#   UNKNOWN   = 不该给确定答案（库外、超出核验窗口、官网没写的时段）
#   AMBIGUOUS = 该先问是哪一个（城内同名）
# 金标准独立于 data/：回官网核对，存 Wayback 链接（gold_archive）。
# q01–q10 从 tests/golden/cases.yaml 搬来（Aaron 2026-10-10 已核对），gold_archive 待补；
# q11–q30 由 CC 2026-11-13 起草，gold 待 Aaron 回官网核对（见 q11 上方的说明）。
# 问法要像真人，日期用 today 钉死；题目日期落在对应景点的核验窗口里
# （布达佩斯 2026-10-08 ~ 2027-01-06，其他城市 2026-11-13 ~ 2027-02-11），
# 只有 out_of_window 题故意落在窗口外。

